version: '3.8'

services:
  api:
    build: .
    container_name: crm_backend_api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Enterprise Python CRM Backend
      - DATABASE_URL=postgresql+asyncpg://crm_user:crm_pass@db:5432/crm_db
      - SECRET_KEY=supersecret_crm_key_change_me_in_production
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: crm_postgres_db
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
